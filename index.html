<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Pagny Mölkky - Gestion Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clubblue: { DEFAULT: '#2c4a7c', dark: '#1b3054' },
                        clubyellow: { DEFAULT: '#f4c430', light: '#fdf8e2' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50/40 text-stone-800 min-h-screen font-sans pb-12">

    <!-- Header Navigation -->
    <header class="bg-clubblue-dark text-white shadow-lg sticky top-0 z-50 border-b-4 border-clubyellow">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <!-- Logo cliquable 3 fois pour activer l'admin discrètement -->
            <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="secretAdminTrigger()" title="Cliquez 3 fois ici pour l'Admin">
                <div class="bg-clubyellow text-clubblue-dark rounded-xl w-11 h-11 flex flex-col items-center justify-center font-black shadow border border-yellow-500">
                    <span class="text-xs leading-none">AS</span>
                    <span class="text-sm leading-none">54</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight tracking-wide text-white">AS Pagny Mölkky</h1>
                    <p class="text-xs text-clubyellow font-medium">Club de Mölkky (54) • Planning & Tournois</p>
                </div>
            </div>

            <!-- Indicateur discret de l'état Admin -->
            <div class="flex items-center space-x-2 text-sm">
                <span id="admin-badge" class="hidden bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow">Mode Admin Actif</span>
            </div>
        </div>
        
        <div class="bg-clubblue text-white">
            <div class="max-w-5xl mx-auto px-4 flex space-x-4">
                <button onclick="switchTab('tournaments')" id="tab-tournaments" class="py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-trophy"></i> Tournois
                </button>
                <button onclick="switchTab('members')" id="tab-members" class="py-2.5 px-3 border-b-2 border-transparent font-medium text-sm text-blue-200 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-users"></i> Membres (<span id="member-count">14</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- TAB: TOURNOIS -->
        <section id="view-tournaments" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">Calendrier des Tournois</h2>
                    <p class="text-xs text-stone-500">Indiquez directement votre disponibilité pour chaque tournoi.</p>
                </div>
                <button onclick="openModal('modal-tournament')" class="admin-only hidden bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-4 py-2 rounded-lg shadow transition text-sm flex items-center gap-2 self-start sm:self-auto">
                    <i class="fa-solid fa-plus"></i> Ajouter un Tournoi
                </button>
            </div>

            <div id="tournaments-list" class="space-y-6">
                <!-- Javascript Injection -->
            </div>
        </section>

        <!-- TAB: MEMBRES -->
        <section id="view-members" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">Membres du Club AS Pagny Mölkky</h2>
                    <p class="text-xs text-stone-500">Effectif complet des 14 membres enregistrés.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="resetDefaultData()" class="admin-only hidden bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-medium px-3 py-2 rounded-lg text-xs items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> Recharger 14 Membres
                    </button>
                    <button onclick="openModal('modal-member')" class="admin-only hidden bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-4 py-2 rounded-lg shadow transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Nouveau Membre
                    </button>
                </div>
            </div>

            <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Javascript Injection -->
            </div>
        </section>

    </main>

    <!-- MODAL: NOUVEAU TOURNOI -->
    <div id="modal-tournament" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-stone-800">Ajouter un Tournoi</h3>
                <button onclick="closeModal('modal-tournament')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-tournament" onsubmit="saveTournament(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Nom du Tournoi</label>
                    <input type="text" id="t-name" required placeholder="Ex: Open de France, Tournoi Inter-Clubs" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Date</label>
                        <input type="date" id="t-date" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Format</label>
                        <select id="t-format" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="Doublette">Doublette (2)</option>
                            <option value="Triplette">Triplette (3)</option>
                            <option value="Quadrette">Quadrette (4)</option>
                            <option value="Individuel">Individuel (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Lieu</label>
                    <input type="text" id="t-location" placeholder="Ex: Pagny-sur-Moselle" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-tournament')" class="px-4 py-2 text-sm font-medium text-stone-600">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-clubblue hover:bg-blue-800 text-white rounded-lg shadow">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: NOUVEAU MEMBRE -->
    <div id="modal-member" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-stone-800">Ajouter un Membre</h3>
                <button onclick="closeModal('modal-member')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-member" onsubmit="saveMember(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Nom et Prénom</label>
                    <input type="text" id="m-name" required placeholder="Ex: Jean Dupont" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Rôle / Fonction dans le club</label>
                    <input type="text" id="m-role" placeholder="Ex: Joueur, Trésorier, etc." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-member')" class="px-4 py-2 text-sm font-medium text-stone-600">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-clubblue hover:bg-blue-800 text-white rounded-lg shadow">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DEFAULT_MEMBERS = [
            { id: '1', name: 'Cyril Fortin', role: 'Président' },
            { id: '2', name: 'Sylvain Gaugain', role: 'Vice Président' },
            { id: '3', name: 'Laura Gaugain', role: 'Secrétaire' },
            { id: '4', name: 'Inès Chaouch', role: 'Trésorière' },
            { id: '5', name: 'Arnaud Pierre', role: 'Communication' },
            { id: '6', name: 'Yvon Nicolay', role: 'Membre' },
            { id: '7', name: 'François Perrin', role: 'Membre' },
            { id: '8', name: 'Jacques Gaugain', role: 'Membre' },
            { id: '9', name: 'Seb Bausch', role: 'Membre' },
            { id: '10', name: 'Bryan Bausch', role: 'Membre' },
            { id: '11', name: 'Logan Gangloff', role: 'Membre' },
            { id: '12', name: 'Patrick Gangloff', role: 'Membre' },
            { id: '13', name: 'Béa Gangloff', role: 'Membre' },
            { id: '14', name: 'Nathalie Mercier', role: 'Membre' }
        ];

        let state = { isAdmin: false, adminPassword: 'admin54', members: [], tournaments: [] };
        let clickCount = 0;
        let clickTimer = null;

        function initApp() {
            const savedMembers = localStorage.getItem('as_pagny_members');
            const savedTournaments = localStorage.getItem('as_pagny_tournaments');
            state.members = (savedMembers && JSON.parse(savedMembers).length > 0) ? JSON.parse(savedMembers) : DEFAULT_MEMBERS;
            state.tournaments = (savedTournaments) ? JSON.parse(savedTournaments) : [];
            saveData();
            render();
        }

        function saveData() {
            localStorage.setItem('as_pagny_members', JSON.stringify(state.members));
            localStorage.setItem('as_pagny_tournaments', JSON.stringify(state.tournaments));
        }

        function resetDefaultData() {
            if(confirm("Recharger la liste officielle des 14 membres ?")) {
                state.members = DEFAULT_MEMBERS;
                saveData();
                render();
            }
        }

        // Astuce secrète : cliquez 3 fois sur le logo "AS 54" en haut à gauche pour activer/désactiver l'admin
        function secretAdminTrigger() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            } else if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                
                if (state.isAdmin) {
                    state.isAdmin = false;
                    alert("Mode Administrateur désactivé.");
                } else {
                    const pass = prompt("Mot de passe administrateur :");
                    if (pass === state.adminPassword) {
                        state.isAdmin = true;
                        alert("Mode Administrateur activé !");
                    } else if (pass !== null) {
                        alert("Mot de passe incorrect.");
                    }
                }
                render();
            }
        }

        function switchTab(tab) {
            document.getElementById('view-tournaments').classList.toggle('hidden', tab !== 'tournaments');
            document.getElementById('view-members').classList.toggle('hidden', tab !== 'members');
            document.getElementById('tab-tournaments').className = tab === 'tournaments' ? 'py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2
