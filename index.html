<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Pagny Mölkky - Gestion Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body style="background-color: #f1f5f9; color: #1e293b; font-family: sans-serif; margin: 0; padding-bottom: 50px;">

    <!-- Header Navigation -->
    <header style="background-color: #0f172a; color: white; position: sticky; top: 0; z-index: 50; border-bottom: 4px solid #dc2626; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
        <div style="max-width: 1000px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 12px; user-select: none;">
                <div style="background: white; padding: 4px; border-radius: 12px; border: 1px solid rgba(220,38,38,0.4); display: flex; align-items: center; justify-content: center;">
                    <img src="https://raw.githubusercontent.com/niavlys54/Inscription-tournoi-M-lkky-/main/logo.png" 
                         onerror="this.onerror=null; this.src='https://i.ibb.co/L50Q28f/logo-pagny.png';" 
                         alt="AS Pagny Mölkky 1938" 
                         style="height: 48px; width: auto; object-fit: contain;">
                </div>
                <div>
                    <h1 style="font-size: 1.25rem; font-weight: 900; letter-spacing: 0.05em; margin: 0; display: flex; align-items: center; gap: 8px; color: white;">
                        AS PAGNY MÖLKKY
                        <span style="background-color: #dc2626; color: white; font-size: 10px; padding: 2px 8px; border-radius: 9999px; font-weight: bold; text-transform: uppercase;">54</span>
                    </h1>
                    <p style="font-size: 0.75rem; color: #93c5fd; margin: 2px 0 0 0; font-weight: 500;">Club de Mölkky • Saison 2026</p>
                </div>
            </div>

            <div>
                <button onclick="toggleAdminMode()" id="admin-btn" style="background-color: #1d4ed8; color: white; padding: 6px 14px; border-radius: 8px; font-weight: 500; font-size: 0.875rem; border: 1px solid rgba(96,165,250,0.3); cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-lock" id="admin-icon" style="color: #fde047; font-size: 12px;"></i>
                    <span id="admin-btn-text">Mode Admin</span>
                </button>
            </div>
        </div>
        
        <div style="background-color: #1d4ed8;">
            <div style="max-width: 1000px; margin: 0 auto; padding: 0 16px; display: flex; gap: 16px;">
                <button onclick="switchTab('tournaments')" id="tab-tournaments" style="background: none; border: none; padding: 10px 12px; border-bottom: 2px solid #dc2626; font-weight: bold; font-size: 0.875rem; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-trophy" style="color: #f87171;"></i> Tournois
                </button>
                <button onclick="switchTab('members')" id="tab-members" style="background: none; border: none; padding: 10px 12px; border-bottom: 2px solid transparent; font-weight: 500; font-size: 0.875rem; color: #bfdbfe; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-users"></i> Membres (<span id="member-count">14</span>)
                </button>
            </div>
        </div>
    </header>

    <main style="max-width: 1000px; margin: 0 auto; padding: 24px 16px;">

        <!-- ONGLET: TOURNOIS -->
        <section id="view-tournaments" style="display: flex; flex-direction: column; gap: 24px;">
            <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #cbd5e1; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px;">
                <div>
                    <h2 style="font-size: 1.125rem; font-weight: bold; margin: 0 0 4px 0; color: #1e293b;">Calendrier des Tournois</h2>
                    <p style="font-size: 0.75rem; color: #64748b; margin: 0;">Disponibilités et équipes partagées en direct pour tout le club.</p>
                </div>
                <button onclick="openModal('modal-tournament')" class="admin-only" style="display: none; background-color: #dc2626; color: white; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.875rem; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-plus"></i> Nouveau Tournoi
                </button>
            </div>

            <div id="tournaments-list" style="display: flex; flex-direction: column; gap: 24px;"></div>
        </section>

        <!-- ONGLET: MEMBRES -->
        <section id="view-members" style="display: none; flex-direction: column; gap: 24px;">
            <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #cbd5e1; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 16px;">
                <div>
                    <h2 style="font-size: 1.125rem; font-weight: bold; margin: 0 0 4px 0; color: #1e293b;">Membres du Club AS Pagny Mölkky</h2>
                    <p style="font-size: 0.75rem; color: #64748b; margin: 0;">Effectif officiel du club.</p>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="resetDefaultData()" class="admin-only" style="display: none; background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-weight: 500; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.75rem;">
                        <i class="fa-solid fa-rotate-left"></i> Réinitialiser
                    </button>
                    <button onclick="openModal('modal-member')" class="admin-only" style="display: none; background-color: #dc2626; color: white; font-weight: 500; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.875rem;">
                        <i class="fa-solid fa-user-plus"></i> Nouveau Membre
                    </button>
                </div>
            </div>

            <div id="members-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;"></div>
        </section>

    </main>

    <!-- MODALE TOURNOI -->
    <div id="modal-tournament" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: white; border-radius: 12px; max-width: 400px; width: 100%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px;">
                <h3 style="font-weight: bold; font-size: 1.125rem; margin: 0; color: #1e293b;">Ajouter un Tournoi</h3>
                <button onclick="closeModal('modal-tournament')" style="background: none; border: none; font-size: 1.25rem; color: #94a3b8; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveTournament(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Nom du Tournoi</label>
                    <input type="text" id="t-name" required placeholder="Ex: Black Mölkky Boulay" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Date</label>
                        <input type="date" id="t-date" required style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Format</label>
                        <select id="t-format" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box; background: white;">
                            <option value="Doublette">Doublette (2)</option>
                            <option value="Triplette">Triplette (3)</option>
                            <option value="Quadrette">Quadrette (4)</option>
                            <option value="Individuel">Individuel (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Lieu</label>
                    <input type="text" id="t-location" placeholder="Ex: Complexe Isabelle Wendling" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
                    <button type="button" onclick="closeModal('modal-tournament')" style="background: none; border: none; padding: 8px 16px; font-size: 0.875rem; font-weight: 500; color: #64748b; cursor: pointer;">Annuler</button>
                    <button type="submit" style="background: #1d4ed8; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer;">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE EQUIPE -->
    <div id="modal-team" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: white; border-radius: 12px; max-width: 400px; width: 100%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px;">
                <h3 style="font-weight: bold; font-size: 1.125rem; margin: 0; color: #1e293b;">Composer une Équipe</h3>
                <button onclick="closeModal('modal-team')" style="background: none; border: none; font-size: 1.25rem; color: #94a3b8; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveTeam(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="hidden" id="team-tournament-id">
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Nom de l'équipe (ou Duo)</label>
                    <input type="text" id="team-name" required placeholder="Ex: Équipe 1 - Cyril & Sylvain" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 6px;">Sélectionnez les joueurs inscrits :</label>
                    <div id="team-players-checkboxes" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; background: #f8fafc;"></div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
                    <button type="button" onclick="closeModal('modal-team')" style="background: none; border: none; padding: 8px 16px; font-size: 0.875rem; font-weight: 500; color: #64748b; cursor: pointer;">Annuler</button>
                    <button type="submit" style="background: #1d4ed8; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer;">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE MEMBRE -->
    <div id="modal-member" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: white; border-radius: 12px; max-width: 400px; width: 100%; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px;">
                <h3 style="font-weight: bold; font-size: 1.125rem; margin: 0; color: #1e293b;">Ajouter un Membre</h3>
                <button onclick="closeModal('modal-member')" style="background: none; border: none; font-size: 1.25rem; color: #94a3b8; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveMember(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Nom et Prénom</label>
                    <input type="text" id="m-name" required placeholder="Ex: Nom Prénom" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.75rem; font-weight: bold; color: #475569; text-transform: uppercase; margin-bottom: 4px;">Rôle</label>
                    <input type="text" id="m-role" placeholder="Ex: Joueur" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; font-size: 0.875rem; box-sizing: border-box;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
                    <button type="button" onclick="closeModal('modal-member')" style="background: none; border: none; padding: 8px 16px; font-size: 0.875rem; font-weight: 500; color: #64748b; cursor: pointer;">Annuler</button>
                    <button type="submit" style="background: #1d4ed8; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer;">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Configuration Firebase partagée
        const firebaseConfig = {
            apiKey: "AIzaSyDemoConfigKeyForASPagnyMolkky54",
            authDomain: "as-pagny-molkky.firebaseapp.com",
            databaseURL: "https://as-pagny-molkky-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "as-pagny-molkky",
            storageBucket: "as-pagny-molkky.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:demoapppagny54"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const DEFAULT_MEMBERS = [
            { id: '1', name: 'Cyril Fortin', role: 'Président' },
            { id: '2', name: 'Sylvain Gaugain', role: 'Vice Président' },
            { id: '3', name: 'Laura Gaugain', role: 'Secrétaire' },
            { id: '4', name: 'Inès Chaouch', role: 'Trésorière' },
            { id: '5', name: 'Arnaud Pierre', role: 'Communication' },
            { id: '6', name: 'Yvon Nicolay', role: 'Membre' },
            { id: '7', name: 'François Perrin', role: 'Membre' },
            { id: '8', name: 'Jacques Gaugain', role: 'Membre' },
            { id: '9', name: 'Seb Bausch', role: 'Membre' },
            { id: '10', name: 'Bryan Bausch', role: 'Membre' },
            { id: '11', name: 'Logan Gangloff', role: 'Membre' },
            { id: '12', name: 'Patrick Gangloff', role: 'Membre' },
            { id: '13', name: 'Béa Gangloff', role: 'Membre' },
            { id: '14', name: 'Nathalie Mercier', role: 'Membre' }
        ];

        let state = { isAdmin: false, members: [], tournaments: [] };

        function initApp() {
            // Écoute en direct des changements dans la base Firebase
            db.ref('members').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    state.members = Array.isArray(val) ? val : Object.values(val);
                } else {
                    state.members = DEFAULT_MEMBERS;
                    db.ref('members').set(DEFAULT_MEMBERS);
                }
                render();
            });

            db.ref('tournaments').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    state.tournaments = Object.keys(val).map(key => ({
                        id: key,
                        ...val[key]
                    })).sort((a,b) => b.id - a.id);
                } else {
                    state.tournaments = [];
                }
                render();
            });
        }

        function resetDefaultData() {
            if(confirm("Recharger la liste officielle des 14 membres dans la base partagée ?")) {
                db.ref('members').set(DEFAULT_MEMBERS);
            }
        }

        function toggleAdminMode() {
            if (state.isAdmin) {
                state.isAdmin = false;
                alert("Mode Administrateur désactivé.");
                render();
            } else {
                const pass = prompt("Mot de passe administrateur :");
                if (pass === "admin54") {
                    state.isAdmin = true;
                    alert("Mode Administrateur activé !");
                    render();
                } else if (pass !== null) {
                    alert("Mot de passe incorrect.");
                }
            }
        }

        function switchTab(tab) {
            document.getElementById('view-tournaments').style.display = tab === 'tournaments' ? 'flex' : 'none';
            document.getElementById('view-members').style.display = tab === 'members' ? 'flex' : 'none';
            
            document.getElementById('tab-tournaments').style.borderBottom = tab === 'tournaments' ? '2px solid #dc2626' : '2px solid transparent';
            document.getElementById('tab-tournaments').style.fontWeight = tab === 'tournaments' ? 'bold' : '500';
            document.getElementById('tab-tournaments').style.color = tab === 'tournaments' ? 'white' : '#bfdbfe';

            document.getElementById('tab-members').style.borderBottom = tab === 'members' ? '2px solid #dc2626' : '2px solid transparent';
            document.getElementById('tab-members').style.fontWeight = tab === 'members' ? 'bold' : '500';
            document.getElementById('tab-members').style.color = tab === 'members' ? 'white' : '#bfdbfe';
        }

        function setStatus(tournamentId, memberId, newStatus) {
            db.ref(`tournaments/${tournamentId}/statuses/${memberId}`).set(newStatus);
        }

        function toggleAvailabilityMenu(tournamentId) {
            const container = document.getElementById(`avail-container-${tournamentId}`);
            const icon = document.getElementById(`avail-icon-${tournamentId}`);
            if (container.style.display === 'none') {
                container.style.display = 'block';
                icon.className = 'fa-solid fa-chevron-up';
            } else {
                container.style.display = 'none';
                icon.className = 'fa-solid fa-chevron-down';
            }
        }

        function saveTournament(e) {
            e.preventDefault();
            const newId = Date.now().toString();
            const tournamentData = {
                name: document.getElementById('t-name').value,
                date: document.getElementById('t-date').value,
                format: document.getElementById('t-format').value,
                location: document.getElementById('t-location').value,
                statuses: {},
                teams: []
            };
            db.ref(`tournaments/${newId}`).set(tournamentData);
            closeModal('modal-tournament');
            document.getElementById('form-tournament').reset();
        }

        function deleteTournament(id) {
            if (confirm("Supprimer ce tournoi pour l'ensemble du club ?")) {
                db.ref(`tournaments/${id}`).remove();
            }
        }

        function openTeamModal(tournamentId) {
            document.getElementById('team-tournament-id').value = tournamentId;
            document.getElementById('team-name').value = '';
            
            const tournament = state.tournaments.find(t => t.id === tournamentId);
            const container = document.getElementById('team-players-checkboxes');
            
            let html = '';
            state.members.forEach(m => {
                const st = tournament && tournament.statuses && tournament.statuses[m.id];
                if (st === 'registered') {
                    html += `
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: #334155; cursor: pointer;">
                            <input type="checkbox" name="team_player" value="${m.id}" style="width: 16px; height: 16px;">
                            <span>${m.name}</span>
                        </label>
                    `;
                }
            });

            if (html === '') {
                html = `<p style="font-size: 0.75rem; color: #e11d48; font-weight: 500; margin: 0;">Aucun joueur inscrit. Cochez d'abord des inscrits dans la liste !</p>`;
            }

            container.innerHTML = html;
            openModal('modal-team');
        }

        function saveTeam(e) {
            e.preventDefault();
            const tournamentId = document.getElementById('team-tournament-id').value;
            const teamName = document.getElementById('team-name').value;
            
            const checkboxes = document.querySelectorAll('input[name="team_player"]:checked');
            const playerIds = Array.from(checkboxes).map(cb => cb.value);

            if (playerIds.length === 0) {
                alert("Veuillez sélectionner au moins un joueur.");
                return;
            }

            const teamId = Date.now().toString();
            db.ref(`tournaments/${tournamentId}/teams/${teamId}`).set({
                id: teamId,
                name: teamName,
                playerIds: playerIds
            });

            closeModal('modal-team');
        }

        function deleteTeam(tournamentId, teamId) {
            if (confirm("Supprimer cette équipe ?")) {
                db.ref(`tournaments/${tournamentId}/teams/${teamId}`).remove();
            }
        }

        function saveMember(e) {
            e.preventDefault();
            const newMember = {
                id: Date.now().toString(),
                name: document.getElementById('m-name').value,
                role: document.getElementById('m-role').value || 'Membre'
            };
            const updatedMembers = [...state.members, newMember];
            db.ref('members').set(updatedMembers);
            closeModal('modal-member');
            document.getElementById('form-member').reset();
        }

        function deleteMember(id) {
            if (confirm("Supprimer ce membre ?")) {
                const updatedMembers = state.members.filter(m => m.id !== id);
                db.ref('members').set(updatedMembers);
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function render() {
            const btnText = document.getElementById('admin-btn-text');
            const btnIcon = document.getElementById('admin-icon');
            if (btnText && btnIcon) {
                btnText.textContent = state.isAdmin ? "Admin Actif" : "Mode Admin";
                btnIcon.className = state.isAdmin ? "fa-solid fa-lock-open" : "fa-solid fa-lock";
                btnIcon.style.color = state.isAdmin ? "#34d399" : "#fde047";
            }
            
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = state.isAdmin ? 'flex' : 'none';
            });
            
            const countEl = document.getElementById('member-count');
            if (countEl) countEl.textContent = state.members.length;

            const membersGrid = document.getElementById('members-grid');
            if (membersGrid) {
                membersGrid.innerHTML = state.members.map(m => `
                    <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="width: 40px; height: 40px; border-radius: 50%; background: #eff6ff; color: #1d4ed8; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; border: 1px solid #bfdbfe;">${m.name.split(' ').map(n=>n[0]).join('')}</div>
                            <div>
                                <div style="font-weight: bold; color: #1e293b; font-size: 0.875rem;">${m.name}</div>
                                <div style="font-size: 0.75px; color: #dc2626; background: #fef2f2; padding: 2px 8px; border-radius: 9999px; display: inline-block; margin-top: 2px; border: 1px solid #fee2e2; font-weight: 500;">${m.role}</div>
                            </div>
                        </div>
                        ${state.isAdmin ? `<button onclick="deleteMember('${m.id}')" style="background:none; border:none; color:#cbd5e1; cursor:pointer; font-size: 1rem;" title="Supprimer"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                `).join('');
            }

            const tournamentsList = document.getElementById('tournaments-list');
            if (tournamentsList) {
                if (state.tournaments.length === 0) {
                    tournamentsList.innerHTML = `<div style="background: white; padding: 32px; border-radius: 12px; text-align: center; color: #94a3b8; border: 1px solid #cbd5e1;">Aucun tournoi au calendrier pour le moment.</div>`;
                    return;
                }

                tournamentsList.innerHTML = state.tournaments.map(t => {
                    const statuses = t.statuses || {};
                    let registered = 0, available = 0, absent = 0;
                    state.members.forEach(m => {
                        const st = statuses[m.id] || 'none';
                        if (st === 'registered') registered++;
                        else if (st === 'available') available++;
                        else if (st === 'absent') absent++;
                    });

                    const isTeamFormat = t.format === 'Doublette' || t.format === 'Triplette' || t.format === 'Quadrette';
                    const teamsObj = t.teams || {};
                    const teams = Object.values(teamsObj);

                    return `
                        <div style="background: white; border-radius: 12px; border: 1px solid #cbd5e1; overflow: hidden; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1);">
                            <div style="background-color: #0f172a; color: white; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 2px solid #dc2626;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
                                    <div>
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <span style="background-color: #dc2626; color: white; font-weight: bold; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px;">${t.format}</span>
                                            <h3 style="font-weight: bold; font-size: 1.125rem; margin: 0;">${t.name}</h3>
                                        </div>
                                        <div style="font-size: 0.75rem; color: #bfdbfe; display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap;">
                                            <span><i class="fa-regular fa-calendar" style="margin-right: 4px;"></i> ${new Date(t.date).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                            ${t.location ? `<span><i class="fa-solid fa-location-dot" style="margin-right: 4px;"></i> ${t.location}</span>` : ''}
                                        </div>
                                    </div>
                                    ${state.isAdmin ? `<button onclick="deleteTournament('${t.id}')" style="background:none; border:none; color:#fca5a5; cursor:pointer;" title="Supprimer"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                                </div>
                                <div style="display: flex; gap: 8px; font-size: 0.75rem; flex-wrap: wrap;">
                                    <span style="background: #064e3b; color: #a7f3d0; border: 1px solid #047857; padding: 4px 10px; border-radius: 8px;">🟢 ${registered} Inscrits</span>
                                    <span style="background: #78350f; color: #fde68a; border: 1px solid #b45309; padding: 4px 10px; border-radius: 8px;">🟡 ${available} Dispos</span>
                                    <span style="background: #881337; color: #fecdd3; border: 1px solid #9f1239; padding: 4px 10px; border-radius: 8px;">🔴 ${absent} Absents</span>
                                </div>
                            </div>

                            ${isTeamFormat ? `
                                <div style="padding: 16px; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <i class="fa-solid fa-people-group" style="color: #1d4ed8;"></i>
                                            <h4 style="font-size: 0.75rem; font-weight: bold; color: #334155; text-transform: uppercase; margin: 0;">Équipes constituées (${teams.length})</h4>
                                        </div>
                                        ${state.isAdmin ? `
                                            <button onclick="openTeamModal('${t.id}')" style="background: #1d4ed8; color: white; border: none; font-size: 0.75rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                                                <i class="fa-solid fa-user-plus"></i> Composer une équipe
                                            </button>
                                        ` : ''}
                                    </div>
                                    ${teams.length === 0 ? `
                                        <p style="font-size: 0.75rem; color: #64748b; font-style: italic; margin: 0;">Aucune équipe formée pour le moment.</p>
                                    ` : `
                                        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px;">
                                            ${teams.map(tm => {
                                                const playerNames = (tm.playerIds || []).map(pid => {
                                                    const mem = state.members.find(m => m.id === pid);
                                                    return mem ? mem.name : '';
                                                }).filter(Boolean).join(' & ');
                                                return `
                                                    <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #bfdbfe; display: flex; justify-content: space-between; align-items: center;">
                                                        <div>
                                                            <div style="font-size: 0.75rem; font-weight: bold; color: #1d4ed8;">${tm.name}</div>
                                                            <div style="font-size: 0.75rem; color: #334155; margin-top: 2px;"><i class="fa-solid fa-user-check" style="color: #059669; margin-right: 4px;"></i> ${playerNames}</div>
                                                        </div>
                                                        ${state.isAdmin ? `<button onclick="deleteTeam('${t.id}', '${tm.id}')" style="background:none; border:none; color:#cbd5e1; cursor:pointer; font-size: 0.75rem;"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    `}
                                </div>
                            ` : ''}

                            <!-- MENU REPLIANT DES DISPONIBILITÉS -->
                            <div style="background-color: #f8fafc;">
                                <button onclick="toggleAvailabilityMenu('${t.id}')" style="width: 100%; background: #e2e8f0; border: none; padding: 12px 16px; font-weight: bold; font-size: 0.75rem; color: #334155; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                                    <span><i class="fa-solid fa-list-check" style="margin-right: 6px;">&nbsp;</i> Gérer / Voir les disponibilités des membres</span>
                                    <i class="fa-solid fa-chevron-down" id="avail-icon-${t.id}"></i>
                                </button>
                                
                                <div id="avail-container-${t.id}" style="display: none; padding: 16px; border-top: 1px solid #cbd5e1;">
                                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px;">
                                        ${state.members.map(m => {
                                            const st = statuses[m.id] === undefined ? 'none' : statuses[m.id];
                                            return `
                                                <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
                                                    <span style="font-size: 0.8125rem; font-weight: 600; color: #1e293b;">${m.name}</span>
                                                    <div style="display: flex; gap: 4px;">
                                                        <button onclick="setStatus('${t.id}', '${m.id}', 'registered')" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid ${st === 'registered' ? '#059669' : '#cbd5e1'}; background: ${st === 'registered' ? '#059669' : '#f8fafc'}; color: ${st === 'registered' ? 'white' : '#64748b'}; font-weight: ${st === 'registered' ? 'bold' : 'normal'}; cursor: pointer;">Inscrit</button>
                                                        <button onclick="setStatus('${t.id}', '${m.id}', 'available')" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid ${st === 'available' ? '#f59e0b' : '#cbd5e1'}; background: ${st === 'available' ? '#f59e0b' : '#f8fafc'}; color: ${st === 'available' ? '#1e293b' : '#64748b'}; font-weight: ${st === 'available' ? 'bold' : 'normal'}; cursor: pointer;">Dispo</button>
                                                        <button onclick="setStatus('${t.id}', '${m.id}', 'absent')" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid ${st === 'absent' ? '#e11d48' : '#cbd5e1'}; background: ${st === 'absent' ? '#e11d48' : '#f8fafc'}; color: ${st === 'absent' ? 'white' : '#64748b'}; font-weight: ${st === 'absent' ? 'bold' : 'normal'}; cursor: pointer;">Absent</button>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
