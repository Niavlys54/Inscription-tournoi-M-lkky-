<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Pagny Mölkky - Gestion Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clubblue: { DEFAULT: '#1e3a8a', dark: '#0f172a' },
                        clubyellow: { DEFAULT: '#f59e0b', light: '#fef3c7' },
                        clubred: { DEFAULT: '#dc2626' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans pb-12">

    <!-- Header Navigation -->
    <header class="bg-clubblue-dark text-white shadow-md sticky top-0 z-50 border-b-4 border-clubyellow">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3 select-none">
                <div class="bg-white p-1 rounded-xl shadow-md border border-clubyellow/50 flex items-center justify-center">
                    <svg class="w-10 h-10" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 10 L190 50 L190 140 Q100 230 100 230 Q100 230 10 140 L10 50 Z" fill="#FFCC00" stroke="#1E3A8A" stroke-width="6"/>
                        <path d="M15 52 L185 52 L185 138 Q100 222 100 222 Q100 222 15 138 Z" fill="#F5B000"/>
                        <path d="M25 80 L175 130 L165 150 L15 100 Z" fill="#E50012"/>
                        <circle cx="50" cy="95" r="4" fill="white"/><circle cx="65" cy="100" r="4" fill="white"/><circle cx="80" cy="105" r="4" fill="white"/>
                        <path d="M80 50 Q110 35 140 40 Q170 45 160 65 Q140 70 120 60 Q100 75 75 70 Z" fill="#1E3A8A"/>
                        <text x="100" y="150" font-family="Impact, Arial Black, sans-serif" font-size="28" font-weight="bold" fill="black" text-anchor="middle">A.S.</text>
                        <text x="100" y="185" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="bold" fill="black" text-anchor="middle">PAGNY</text>
                        <text x="100" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="black" text-anchor="middle">1938</text>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wide text-white flex items-center gap-2">
                        AS PAGNY MÖLKKY
                        <span class="bg-clubred text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">54</span>
                    </h1>
                    <p class="text-xs text-clubyellow font-medium">Saison 2026 • Planning & Inscriptions</p>
                </div>
            </div>
        </div>
        
        <div class="bg-clubblue text-white">
            <div class="max-w-5xl mx-auto px-4 flex space-x-4">
                <button onclick="switchTab('tournaments')" id="tab-tournaments" class="py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2 transition">
                    <i class="fa-solid fa-trophy text-clubyellow"></i> Tournois
                </button>
                <button onclick="switchTab('members')" id="tab-members" class="py-2.5 px-3 border-b-2 border-transparent font-medium text-sm text-blue-200 hover:text-white flex items-center gap-2 transition">
                    <i class="fa-solid fa-users"></i> Membres (<span id="member-count">14</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- ONGLET: TOURNOIS -->
        <section id="view-tournaments" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Calendrier des Tournois</h2>
                    <p class="text-xs text-slate-500">Cochez votre présence pour chaque événement du club ou ajoutez un nouveau tournoi.</p>
                </div>
                <button onclick="openModal('modal-tournament')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg shadow transition text-sm flex items-center gap-2 self-start sm:self-auto">
                    <i class="fa-solid fa-plus"></i> Ajouter un Tournoi
                </button>
            </div>

            <div id="tournaments-list" class="space-y-6">
                <!-- Injection via JavaScript -->
            </div>
        </section>

        <!-- ONGLET: MEMBRES -->
        <section id="view-members" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Membres du Club AS Pagny Mölkky</h2>
                    <p class="text-xs text-slate-500">Effectif officiel des 14 joueurs inscrits.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="resetDefaultData()" class="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-medium px-3 py-2 rounded-lg text-xs flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> Réinitialiser les 14 membres
                    </button>
                    <button onclick="openModal('modal-member')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg shadow transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Nouveau Membre
                    </button>
                </div>
            </div>

            <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Injection via JavaScript -->
            </div>
        </section>

    </main>

    <!-- FENÊTRE MODALE: AJOUTER TOURNOI -->
    <div id="modal-tournament" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800">Ajouter un Tournoi</h3>
                <button onclick="closeModal('modal-tournament')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-tournament" onsubmit="saveTournament(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nom du Tournoi</label>
                    <input type="text" id="t-name" required placeholder="Ex: Open de Moselle" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date</label>
                        <input type="date" id="t-date" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Format</label>
                        <select id="t-format" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="Doublette">Doublette (2)</option>
                            <option value="Triplette">Triplette (3)</option>
                            <option value="Quadrette">Quadrette (4)</option>
                            <option value="Individuel">Individuel (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lieu</label>
                    <input type="text" id="t-location" placeholder="Ex: Pagny-sur-Moselle" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-tournament')" class="px-4 py-2 text-sm font-medium text-slate-600">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-clubblue hover:bg-blue-900 text-white rounded-lg shadow">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FENÊTRE MODALE: AJOUTER MEMBRE -->
    <div id="modal-member" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800">Ajouter un Membre</h3>
                <button onclick="closeModal('modal-member')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-member" onsubmit="saveMember(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nom et Prénom</label>
                    <input type="text" id="m-name" required placeholder="Ex: Nom Prénom" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rôle</label>
                    <input type="text" id="m-role" placeholder="Ex: Joueur" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-member')" class="px-4 py-2 text-sm font-medium text-slate-600">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-clubblue hover:bg-blue-900 text-white rounded-lg shadow">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DEFAULT_MEMBERS = [
            { id: '1', name: 'Cyril Fortin', role: 'Président' },
            { id: '2', name: 'Sylvain Gaugain', role: 'Vice Président' },
            { id: '3', name: 'Laura Gaugain', role: 'Secrétaire' },
            { id: '4', name: 'Inès Chaouch', role: 'Trésorière' },
            { id: '5', name: 'Arnaud Pierre', role: 'Communication' },
            { id: '6', name: 'Yvon Nicolay', role: 'Membre' },
            { id: '7', name: 'François Perrin', role: 'Membre' },
            { id: '8', name: 'Jacques Gaugain', role: 'Membre' },
            { id: '9', name: 'Seb Bausch', role: 'Membre' },
            { id: '10', name: 'Bryan Bausch', role: 'Membre' },
            { id: '11', name: 'Logan Gangloff', role: 'Membre' },
            { id: '12', name: 'Patrick Gangloff', role: 'Membre' },
            { id: '13', name: 'Béa Gangloff', role: 'Membre' },
            { id: '14', name: 'Nathalie Mercier', role: 'Membre' }
        ];

        let state = { members: [], tournaments: [] };

        function initApp() {
            const savedMembers = localStorage.getItem('as_pagny_members');
            const savedTournaments = localStorage.getItem('as_pagny_tournaments');
            state.members = (savedMembers && JSON.parse(savedMembers).length > 0) ? JSON.parse(savedMembers) : DEFAULT_MEMBERS;
            state.tournaments = (savedTournaments) ? JSON.parse(savedTournaments) : [];
            saveData();
            render();
        }

        function saveData() {
            localStorage.setItem('as_pagny_members', JSON.stringify(state.members));
            localStorage.setItem('as_pagny_tournaments', JSON.stringify(state.tournaments));
        }

        function resetDefaultData() {
            if(confirm("Recharger la liste officielle des 14 membres ?")) {
                state.members = DEFAULT_MEMBERS;
                saveData();
                render();
            }
        }

        function switchTab(tab) {
            document.getElementById('view-tournaments').classList.toggle('hidden', tab !== 'tournaments');
            document.getElementById('view-members').classList.toggle('hidden', tab !== 'members');
            document.getElementById('tab-tournaments').className = tab === 'tournaments' ? 'py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2 transition' : 'py-2.5 px-3 border-b-2 border-transparent font-medium text-sm text-blue-200 hover:text-white flex items-center gap-2 transition';
            document.getElementById('tab-members').className = tab === 'members' ? 'py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2 transition' : 'py-2.5 px-3 border-b-2 border-transparent font-medium text-sm text-blue-200 hover:text-white flex items-center gap-2 transition';
        }

        function setStatus(tournamentId, memberId, newStatus) {
            const tournament = state.tournaments.find(t => t.id === tournamentId);
            if (tournament) {
                if (!tournament.statuses) tournament.statuses = {};
                tournament.statuses[memberId] = newStatus;
                saveData();
                render();
            }
        }

        function saveTournament(e) {
            e.preventDefault();
            state.tournaments.unshift({
                id: Date.now().toString(),
                name: document.getElementById('t-name').value,
                date: document.getElementById('t-date').value,
                format: document.getElementById('t-format').value,
                location: document.getElementById('t-location').value,
                statuses: {}
            });
            saveData();
            closeModal('modal-tournament');
            document.getElementById('form-tournament').reset();
            render();
        }

        function deleteTournament(id) {
            if (confirm("Supprimer ce tournoi ?")) {
                state.tournaments = state.tournaments.filter(t => t.id !== id);
                saveData();
                render();
            }
        }

        function saveMember(e) {
            e.preventDefault();
            state.members.push({ id: Date.now().toString(), name: document.getElementById('m-name').value, role: document.getElementById('m-role').value || 'Membre' });
            saveData();
            closeModal('modal-member');
            document.getElementById('form-member').reset();
            render();
        }

        function deleteMember(id) {
            if (confirm("Supprimer ce membre ?")) {
                state.members = state.members.filter(m => m.id !== id);
                saveData();
                render();
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function render() {
            const countEl = document.getElementById('member-count');
            if (countEl) countEl.textContent = state.members.length;

            const membersGrid = document.getElementById('members-grid');
            if (membersGrid) {
                membersGrid.innerHTML = state.members.map(m => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-clubyellow-light text-blue-900 font-bold flex items-center justify-center text-sm border border-amber-300">${m.name.split(' ').map(n=>n[0]).join('')}</div>
                            <div>
                                <div class="font-bold text-slate-800 text-sm">${m.name}</div>
                                <div class="text-xs text-clubblue bg-blue-50 px-2 py-0.5 rounded-full inline-block mt-0.5 border border-blue-100 font-medium">${m.role}</div>
                            </div>
                        </div>
                        <button onclick="deleteMember('${m.id}')" class="text-slate-300 hover:text-red-600 p-1" title="Supprimer le membre"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');
            }

            const tournamentsList = document.getElementById('tournaments-list');
            if (tournamentsList) {
                if (state.tournaments.length === 0) {
                    tournamentsList.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 border border-slate-200">Aucun tournoi au calendrier pour le moment. Cliquez sur <strong>"Ajouter un Tournoi"</strong> ci-dessus pour en créer un !</div>`;
                    return;
                }

                tournamentsList.innerHTML = state.tournaments.map(t => {
                    const statuses = t.statuses || {};
                    let registered = 0, available = 0, absent = 0;
                    state.members.forEach(m => {
                        const st = statuses[m.id] || 'none';
                        if (st === 'registered') registered++;
                        else if (st === 'available') available++;
                        else if (st === 'absent') absent++;
                    });

                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-clubblue-dark text-white p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 border-b-2 border-clubyellow">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="bg-clubyellow text-clubblue-dark font-bold text-xs px-2 py-0.5 rounded">${t.format}</span>
                                        <h3 class="font-bold text-lg">${t.name}</h3>
                                    </div>
                                    <div class="text-xs text-blue-200 flex items-center gap-4 mt-1">
                                        <span><i class="fa-regular fa-calendar mr-1"></i> ${new Date(t.date).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                        ${t.location ? `<span><i class="fa-solid fa-location-dot mr-1"></i> ${t.location}</span>` : ''}
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 text-xs flex-wrap">
                                    <span class="bg-emerald-900 text-emerald-200 border border-emerald-700 px-2.5 py-1 rounded-lg">🟢 ${registered} Inscrits</span>
                                    <span class="bg-amber-900 text-amber-200 border border-amber-700 px-2.5 py-1 rounded-lg">🟡 ${available} Dispos</span>
                                    <span class="bg-rose-900 text-rose-200 border border-rose-700 px-2.5 py-1 rounded-lg">🔴 ${absent} Absents</span>
                                    <button onclick="deleteTournament('${t.id}')" class="ml-2 text-rose-300 hover:text-white p-1" title="Supprimer le tournoi"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>

                            <div class="p-4 bg-slate-50">
                                <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Disponibilités des Membres</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                    ${state.members.map(m => {
                                        const st = statuses[m.id] === undefined ? 'none' : statuses[m.id];
                                        return `
                                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 flex items-center justify-between shadow-xs">
                                                <span class="text-xs font-semibold text-slate-800">${m.name}</span>
                                                <div class="flex items-center space-x-1">
                                                    <button onclick="setStatus('${t.id}', '${m.id}', 'registered')" title="Inscrit" class="px-2 py-1 text-xs rounded border transition ${st === 'registered' ? 'bg-emerald-600 text-white font-bold border-emerald-600 shadow-xs' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 border-slate-200'}">Inscrit</button>
                                                    <button onclick="setStatus('${t.id}', '${m.id}', 'available')" title="Disponible" class="px-2 py-1 text-xs rounded border transition ${st === 'available' ? 'bg-amber-500 text-slate-900 font-bold border-amber-500 shadow-xs' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 border-slate-200'}">Dispo</button>
                                                    <button onclick="setStatus('${t.id}', '${m.id}', 'absent')" title="Absent" class="px-2 py-1 text-xs rounded border transition ${st === 'absent' ? 'bg-rose-600 text-white font-bold border-rose-600 shadow-xs' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 border-slate-200'}">Absent</button>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
