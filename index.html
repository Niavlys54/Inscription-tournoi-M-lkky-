<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Pagny Mölkky - Gestion Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clubblue: {
                            DEFAULT: '#2c4a7c',
                            dark: '#1b3054',
                        },
                        clubred: {
                            DEFAULT: '#b92b27',
                        },
                        clubyellow: {
                            DEFAULT: '#f4c430',
                            light: '#fdf8e2',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen font-sans pb-12">

    <!-- Header Navigation -->
    <header class="bg-clubblue-dark text-white shadow-md sticky top-0 z-50 border-b-4 border-clubyellow">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-clubyellow text-clubblue-dark rounded-xl w-11 h-11 flex flex-col items-center justify-center font-black shadow border border-yellow-500">
                    <span class="text-xs leading-none">AS</span>
                    <span class="text-sm leading-none">54</span>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide text-white flex items-center gap-2">
                        AS Pagny Mölkky
                        <span class="bg-clubred text-white text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase tracking-wider">1938</span>
                    </h1>
                    <p class="text-xs text-clubyellow font-medium">Club de Mölkky • Planning & Tournois</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 text-sm">
                <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="bg-clubblue hover:bg-blue-800 text-white px-3.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 border border-blue-400/30 shadow-2xs">
                    <i class="fa-solid fa-lock text-xs" id="admin-icon"></i>
                    <span id="admin-btn-text">Mode Admin</span>
                </button>
            </div>
        </div>
        
        <div class="bg-clubblue text-white">
            <div class="max-w-5xl mx-auto px-4 flex space-x-4">
                <button onclick="switchTab('tournaments')" id="tab-tournaments" class="py-2.5 px-3 border-b-2 border-clubyellow font-bold text-sm text-white flex items-center gap-2 transition">
                    <i class="fa-solid fa-trophy"></i> Tournois
                </button>
                <button onclick="switchTab('members')" id="tab-members" class="py-2.5 px-3 border-b-2 border-transparent font-medium text-sm text-blue-200 hover:text-white flex items-center gap-2 transition">
                    <i class="fa-solid fa-users"></i> Membres (<span id="member-count">14</span>)
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">

        <!-- TAB: TOURNOIS -->
        <section id="view-tournaments" class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-xs border border-stone-200">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">Calendrier des Tournois</h2>
                    <p class="text-xs text-stone-500">Indiquez directement votre disponibilité pour chaque tournoi.</p>
                </div>
                <button onclick="openModal('modal-tournament')" class="admin-only hidden bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-4 py-2 rounded-lg shadow-2xs transition text-sm flex items-center gap-2 self-start sm:self-auto">
                    <i class="fa-solid fa-plus"></i> Ajouter un Tournoi
                </button>
            </div>

            <div id="tournaments-list" class="space-y-6">
                <!-- Javascript Injection -->
            </div>
        </section>

        <!-- TAB: MEMBRES -->
        <section id="view-members" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-xs border border-stone-200">
                <div>
                    <h2 class="text-lg font-bold text-stone-800">Membres du Club AS Pagny Mölkky</h2>
                    <p class="text-xs text-stone-500">Effectif complet des 14 membres enregistrés.</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="resetDefaultData()" class="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 font-medium px-3 py-2 rounded-lg text-xs flex items-center gap-1 transition">
                        <i class="fa-solid fa-rotate-left"></i> Recharger 14 Membres
                    </button>
                    <button onclick="openModal('modal-member')" class="admin-only hidden bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-4 py-2 rounded-lg shadow-2xs transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Nouveau Membre
                    </button>
                </div>
            </div>

            <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Javascript Injection -->
            </div>
        </section>

    </main>

    <!-- MODAL: NOUVEAU TOURNOI -->
    <div id="modal-tournament" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-stone-800">Ajouter un Tournoi</h3>
                <button onclick="closeModal('modal-tournament')" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="form-tournament" onsubmit="saveTournament(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Nom du Tournoi</label>
                    <input type="text" id="t-name" required placeholder="Ex: Open de France, Tournoi Inter-Clubs" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Date</label>
                        <input type="date" id="t-date" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Format</label>
                        <select id="t-format" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="Doublette">Doublette (2)</option>
                            <option value="Triplette">Triplette (3)</option>
                            <option value="Quadrette">Quadrette (4)</option>
                            <option value="Individuel">Individuel (1)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Lieu</label>
                    <input type="text" id="t-location" placeholder="Ex: Pagny-sur-Moselle" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-tournament')" class="px-4 py-2 text-sm font-medium text-stone-600">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-clubblue hover:bg-blue
